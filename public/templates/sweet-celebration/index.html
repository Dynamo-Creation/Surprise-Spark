<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sweet Celebration — A heartwarming pastel birthday celebration with bouncing party flags, polaroid frame, animated balloons, and interactive typewriter letterbox.">
  <title>Sweet Celebration 💌</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Sriracha&family=Dancing+Script:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <!-- Preload local image and GIF assets for instant smooth rendering -->
  <link rel="preload" href="1.png" as="image">
  <link rel="preload" href="hat.png" as="image">
  <link rel="preload" href="balloon1.png" as="image">
  <link rel="preload" href="balloon2.png" as="image">
  <link rel="preload" href="heart_animated.gif" as="image">
  <link rel="preload" href="love_animated.gif" as="image">
  <link rel="preload" href="mewmew.gif" as="image">
</head>
<body>

  <!-- Fullscreen Confetti Canvas Overlay -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Ambient Sound Toggle Button -->
  <button type="button" class="sound-toggle-btn" id="soundToggleBtn" aria-label="Toggle Celebration Audio" title="Click for celebratory pastel chimes & music">
    <span id="soundIcon">🎵</span>
  </button>

  <main class="stage-wrapper">
    <!-- 1. Festive Bunting Party Flags Drop -->
    <div class="flag-banner" aria-hidden="true">
      <img src="1.png" alt="Party Bunting Flag" class="flag-left" />
      <img src="1.png" alt="Party Bunting Flag" class="flag-right" />
    </div>

    <!-- Decorative Floating Sparkles -->
    <div class="sparkle-decor sparkle-1" aria-hidden="true">✨</div>
    <div class="sparkle-decor sparkle-2" aria-hidden="true">⭐</div>
    <div class="sparkle-decor sparkle-3" aria-hidden="true">🌸</div>
    <div class="sparkle-decor sparkle-4" aria-hidden="true">💖</div>

    <!-- 2. Main Stage Content Grid -->
    <div class="main-stage">
      <!-- Left Column: Typography + Hat + Date Badge + Open Letter CTA -->
      <section class="left-col">
        <div class="title-container">
          <div class="title-happy">
            <span style="--delay: 0.3s">H</span>
            <span style="--delay: 0.4s">a</span>
            <span style="--delay: 0.5s">p</span>
            <span style="--delay: 0.6s">p</span>
            <span class="letter-y-anchor" style="--delay: 0.7s">
              y
              <!-- Party Hat perched on top of letter Y -->
              <div class="party-hat" aria-hidden="true">
                <img src="hat.png" alt="Celebration Party Hat" />
              </div>
            </span>
          </div>
          <div class="title-birthday">
            <span style="--delay: 0.8s">B</span>
            <span style="--delay: 0.9s">i</span>
            <span style="--delay: 1.0s">r</span>
            <span style="--delay: 1.1s">t</span>
            <span style="--delay: 1.2s">h</span>
            <span style="--delay: 1.3s">d</span>
            <span style="--delay: 1.4s">a</span>
            <span style="--delay: 1.5s">y</span>
          </div>
        </div>

        <!-- Date of Birth Badge with Twinkling Stars -->
        <div class="date-badge">
          <span class="star" aria-hidden="true">★</span>
          <span class="text" id="specialDateDisplay">23 May 2005</span>
          <span class="star" aria-hidden="true">★</span>
        </div>

        <!-- Open Letter Button -->
        <div class="btn-open-container">
          <button type="button" class="btn-open-letter" id="btnLetter" aria-label="Open Birthday Letter Box">
            <span>Click here</span>
            <span class="icon-heart">💌</span>
          </button>
        </div>
      </section>

      <!-- Right Column: Recipient Photo Circle + Compact Balloons + Rotating Badge -->
      <section class="right-col">
        <div class="photo-stage">
          <!-- Recipient Photo Circle (Sized to fit screen perfectly) -->
          <div class="photo-frame-circle" id="photoFrameCircle" title="Recipient Celebrant Photo">
            <img src="r5.jpg" alt="Recipient Birthday Photo" id="recipientPhoto" />
          </div>

          <!-- Recipient Name Pill Badge -->
          <div class="recipient-name-pill">
            <span class="pulse-heart" aria-hidden="true">♥</span>
            <span id="recipientNameDisplay">Hayati</span>
            <span class="pulse-heart" aria-hidden="true">♥</span>
          </div>

          <!-- Left Balloon Cluster: Compact, tucked neatly on top-left of circle, NEVER covering Birthday -->
          <div class="balloon-left" aria-hidden="true">
            <img src="balloon1.png" alt="Celebration Balloons" />
          </div>

          <!-- Right Balloon Cluster: Compact, tucked neatly on bottom-right of circle -->
          <div class="balloon-right" aria-hidden="true">
            <img src="balloon2.png" alt="Celebration Balloons" />
          </div>
        </div>

        <!-- Rotating "Happy Birthday" Circular Text Badge -->
        <div class="rotating-badge" aria-hidden="true">
          <div class="circular-text-ring">
            <span style="transform: rotate(0deg)">h</span>
            <span style="transform: rotate(24deg)">a</span>
            <span style="transform: rotate(48deg)">p</span>
            <span style="transform: rotate(72deg)">p</span>
            <span style="transform: rotate(96deg)">y</span>
            <span style="transform: rotate(120deg)">-</span>
            <span style="transform: rotate(144deg)">b</span>
            <span style="transform: rotate(168deg)">i</span>
            <span style="transform: rotate(192deg)">r</span>
            <span style="transform: rotate(216deg)">t</span>
            <span style="transform: rotate(240deg)">h</span>
            <span style="transform: rotate(264deg)">d</span>
            <span style="transform: rotate(288deg)">a</span>
            <span style="transform: rotate(312deg)">y</span>
            <span style="transform: rotate(336deg)">-</span>
          </div>
          <span class="badge-heart-center">♥</span>
        </div>
      </section>
    </div>
  </main>

  <!-- 3. Interactive Letterbox Modal Dialog with Animated GIFs -->
  <div class="letter-modal-backdrop" id="letterModal" role="dialog" aria-modal="true" aria-labelledby="letterRecipientName">
    <div class="letter-card">
      <button type="button" class="btn-close-letter" id="btnCloseLetter" aria-label="Close Letter Box">
        ✕
      </button>

      <div class="letter-card-inner">
        <!-- Title -->
        <h2 class="letter-title">
          To <span id="letterRecipientName">Hayati</span> ❤️
        </h2>

        <!-- Content Columns -->
        <div class="letter-columns">
          <!-- Left Column Art: Animated Heart GIF + Floating Mini Hearts -->
          <div class="letter-left-art">
            <img
              id="heartLetterGif"
              src="heart_animated.gif"
              alt="Animated Pulsing Heart"
              class="heart-art"
              onerror="this.src='heart_letter.png'"
            />
            <img class="heart-float heart-float-1" src="heart.png" alt="" />
            <img class="heart-float heart-float-2" src="heart.png" alt="" />
            <img class="heart-float heart-float-3" src="heart.png" alt="" />
            <img class="heart-float heart-float-4" src="heart.png" alt="" />
          </div>

          <!-- Right Column: Animated Love GIF, Typewriter Text & Mewmew Cat GIF -->
          <div class="letter-right-body">
            <div class="letter-love-header">
              <img
                id="loveHeaderGif"
                src="love_animated.gif"
                alt="Animated Love Art"
                onerror="this.src='love.png'"
              />
            </div>

            <p class="letter-body-text" id="letterBodyText"></p>

            <p class="letter-sender-sign" id="letterSenderSign" style="display: none;"></p>

            <div class="letter-cat-container">
              <img src="mewmew.gif" alt="Cute Mewmew Cat" />
            </div>
          </div>
        </div>

        <!-- Footer Action -->
        <div class="letter-footer-cta">
          <button type="button" class="btn-celebrate-finish" id="celebrateFinishBtn">
            <span>Celebrate Together! 🎉</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview Helper Controls Bar -->
  <div class="preview-controls-bar">
    <button type="button" class="btn-preview-tool" id="btnFastForward" title="Fast-forward entrance animations">
      ⚡ Fast-Forward
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
